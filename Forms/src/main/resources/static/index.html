<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee List</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
    }
    th {
        background-color: #f4f4f4;
    }
    .actions {
        display: flex;
        gap: 10px;
    }
    .edit-btn {
        background-color: blue;
        color: white;
        padding: 5px 10px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        border-radius: 5px;
    }
    .delete-btn {
        background-color: red;
        color: white;
        padding: 5px 10px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }
  </style>
</head>
<body>
<h1>Coffee List</h1>

<form action="/coffee/search" method="get">
  <input type="text" name="query" placeholder="Search coffee..." required>
  <button type="submit">Search</button>
</form>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Type</th>
    <th>Size</th>
    <th>Price (Peso)</th>
    <th>Roast Level</th>
    <th>Origin</th>
    <th>Decaf</th>
    <th>Stock</th>
    <th>Flavor Notes</th>
    <th>Brew Method</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>

  <tr>
    <td>1</td>
    <td>Espresso</td>
    <td>Coffee</td>
    <td>250g</td>
    <td>12.99</td>
    <td>Dark Roast</td>
    <td>Ethiopia</td>
    <td>No</td>
    <td>1</td>
    <td>Rich, Bold, Chocolatey, Caramel</td>
    <td>Espresso Machine</td>
    <td class="actions">
      <a href="/coffee/edit/1" class="edit-btn">Edit</a>
      <form action="/coffee/delete/1" method="post">
        <button type="submit" class="delete-btn">Delete</button>
      </form>
    </td>
  </tr>

  <tr th:each="coffee : ${coffees}">
    <td th:text="${coffee.id}"></td>
    <td th:text="${coffee.name}"></td>
    <td th:text="${coffee.type}"></td>
    <td th:text="${coffee.size}"></td>
    <td th:text="'Peso ' + ${#numbers.formatDecimal(coffee.price, 1, 2)}"></td>
    <td th:text="${coffee.roastLevel}"></td>
    <td th:text="${coffee.origin}"></td>
    <td th:text="${coffee.decaf ? 'Yes' : 'No'}"></td>
    <td th:text="${coffee.stock}"></td>
    <td th:text="${#strings.arrayJoin(coffee.flavorNotes, ', ')}"></td>
    <td th:text="${coffee.brewMethod}"></td>
    <td class="actions">
      <a th:href="@{/coffee/edit/{id}(id=${coffee.id})}" class="edit-btn">Edit</a>
      <form th:action="@{/coffee/delete/{id}(id=${coffee.id})}" method="post">
        <button type="submit" class="delete-btn">Delete</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

<br>
<a href="/coffee/form">Add New Coffee</a>
</body>
</html>
