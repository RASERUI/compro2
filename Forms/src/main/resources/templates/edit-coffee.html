<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Coffee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<h1>Edit Coffee</h1>

<form th:action="@{/coffee/edit}" th:object="${coffee}" method="post">
    <input type="hidden" th:field="*{id}">

    <label for="name" class="required">Name:</label>
    <input type="text" id="name" th:field="*{name}" required>

    <label for="type" class="required">Type:</label>
    <input type="text" id="type" th:field="*{type}" required>

    <label for="size" class="required">Size:</label>
    <input type="text" id="size" th:field="*{size}" required>

    <label for="price" class="required">Price (₱):</label>
    <input type="number" id="price" th:field="*{price}" step="0.01" min="0" required>

    <label for="roastLevel">Roast Level:</label>
    <input type="text" id="roastLevel" th:field="*{roastLevel}">

    <label for="origin">Origin:</label>
    <input type="text" id="origin" th:field="*{origin}">

    <label for="decaf">Decaf:</label>
    <input type="checkbox" id="decaf" th:field="*{decaf}">
    <input type="hidden" name="_decaf" value="on">

    <label for="stock" class="required">Stock:</label>
    <input type="number" id="stock" th:field="*{stock}" min="0" required>

    <label for="flavorNotes">Flavor Notes (comma separated):</label>
    <input type="text" id="flavorNotes" name="flavorNotes"
           th:value="${#strings.listJoin(coffee.flavorNotes, ', ')}">

    <label for="brewMethod">Brew Method:</label>
    <input type="text" id="brewMethod" th:field="*{brewMethod}">

    <button type="submit">Save Changes</button>
    <a th:href="@{/coffee/}" class="cancel-link">Cancel</a>
</form>

</body>
</html>
