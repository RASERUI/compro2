<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Coffee</title>
</head>
<body>

<h1>Edit Coffee</h1>

<form th:action="@{/coffee/edit}" method="post">
    <input type="hidden" name="id" th:value="${coffee.id}">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" th:value="${coffee.name}" required><br>

    <label for="type">Type:</label>
    <input type="text" id="type" name="type" th:value="${coffee.type}" required><br>

    <label for="size">Size:</label>
    <input type="text" id="size" name="size" th:value="${coffee.size}" required><br>

    <label for="price">Price ($):</label>
    <input type="number" id="price" name="price" th:value="${coffee.price}" step="0.01" required><br>

    <label for="decaf">Decaf:</label>
    <input type="hidden" name="decaf" value="false">
    <input type="checkbox" id="decaf" name="decaf" value="true" th:checked="${coffee.decaf}"><br>

    <button type="submit">Save Changes</button>
</form>

<a href="/coffee/">Cancel</a>

</body>
</html>
