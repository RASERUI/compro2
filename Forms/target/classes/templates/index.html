<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Coffee List</title>
</head>
<body>
<h1>Coffee List</h1>

<a th:href="@{/coffee/add}">Add New Coffee</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Size</th>
        <th>Price</th>
        <th>Roast Level</th>
        <th>Origin</th>
        <th>Decaf</th>
        <th>Stock</th>
        <th>Flavor Notes</th>
        <th>Brew Method</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="coffee : ${coffees}">
        <td th:text="${coffee.id}"></td>
        <td th:text="${coffee.name}"></td>
        <td th:text="${coffee.type}"></td>
        <td th:text="${coffee.size}"></td>
        <td th:text="${'$' + #numbers.formatDecimal(coffee.price, 1, 2)}"></td>
        <td th:text="${coffee.roastLevel}"></td>
        <td th:text="${coffee.origin}"></td>
        <td th:text="${coffee.decaf ? 'Yes' : 'No'}"></td>
        <td th:text="${coffee.stock}"></td>
        <td th:text="${#strings.listJoin(coffee.flavorNotes, ', ')}"></td>
        <td th:text="${coffee.brewMethod}"></td>
        <td>
            <a th:href="@{/coffee/edit/{id}(id=${coffee.id})}">Edit</a>
            <a th:href="@{/coffee/delete/{id}(id=${coffee.id})}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
