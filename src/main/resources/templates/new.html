<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Coffee</title>

  <style>
    /* General Body Styles */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(45deg, #ff6ec7, #ff9a8b, #6a11cb, #2575fc); /* Gradient background */
      background-size: 400% 400%; /* Ensures large gradient area */
      animation: gradientAnimation 15s ease infinite; /* Animation for the background change */
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center; /* Center everything horizontally */
      align-items: flex-start; /* Align to the top */
      flex-direction: column;
      min-height: 100vh; /* Full viewport height */
    }

    /* Container for the form */
    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
      margin-top: 20px; /* Space between body and container */
    }

    /* Heading Styles */
    h1 {
      text-align: center;
      font-size: 32px;
      color: black;
      font-family: 'Montserrat', sans-serif; /* Custom font for bolder look */
      font-weight: 600; /* Bold weight */
      letter-spacing: 1px; /* Add letter spacing for style */
      margin-bottom: 20px;
    }

    /* Form Styles */
    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Form Input Styles */
    label {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px; /* Reduces space between label and checkbox */
    }

    /* Input and Checkbox Styles */
    input[type="text"], input[type="number"], input[type="checkbox"] {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      background-color: white;
    }

    /* Styling the checkbox group */
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px; /* Reduces the space between checkboxes */
    }

    .checkbox-group label {
      display: inline-flex;
      align-items: center;
      margin-right: 10px;
      gap: 5px; /* Space between checkbox and label text */
    }

    .checkbox-group input[type="checkbox"] {
      margin: 0; /* Removes default margin from checkboxes */
    }

    /* Button Styles (Save Coffee Button) */
    button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(45deg, #66ccff, #80b3ff); /* Lighter sky blue gradient */
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      background: linear-gradient(45deg, #80b3ff, #66ccff); /* Reverse gradient on hover */
    }

    /* Link Styles */
    a {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: black;
      text-decoration: none;
    }

    a:hover {
      color: white;
      background-color: black;
      padding: 8px;
      border-radius: 5px;
    }

    /* Gradient Animation */
    @keyframes gradientAnimation {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>New Coffee</h1>
  <form action="/save" method="POST">
    <div>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div>
      <label>Type:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="type[]" value="Robusta">Robusta</label>
        <label><input type="checkbox" name="type[]" value="Arabica">Arabica</label>
      </div>
    </div>

    <div>
      <label>Size:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="size[]" value="Small">Small</label>
        <label><input type="checkbox" name="size[]" value="Medium">Medium</label>
        <label><input type="checkbox" name="size[]" value="Large">Large</label>
      </div>
    </div>

    <div>
      <label for="price">Price:</label>
      <input type="number" step="0.1" id="price" name="price" required>
    </div>

    <div>
      <label>Roast Level:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="roastLevel[]" value="Light">Light</label>
        <label><input type="checkbox" name="roastLevel[]" value="Medium">Medium</label>
        <label><input type="checkbox" name="roastLevel[]" value="Dark">Dark</label>
      </div>
    </div>

    <div>
      <label for="origin">Origin:</label>
      <input type="text" id="origin" name="origin" required>
    </div>

    <div>
      <label>Decaf:</label>
      <input type="hidden" name="isDecaf" value="false">
      <label><input type="checkbox" id="isDecaf" name="isDecaf" value="true">Yes</label>
    </div>

    <div>
      <label>Brew method:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="brewMethod[]" value="Drip">Drip</label>
        <label><input type="checkbox" name="brewMethod[]" value="French-Press">French Press</label>
        <label><input type="checkbox" name="brewMethod[]" value="Espresso">Espresso</label>
      </div>
    </div>

    <div>
      <label for="stock">Stock:</label>
      <input type="number" id="stock" name="stock" required>
    </div>

    <div>
      <label>Flavor Notes:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="flavorNotes[]" value="Chocolate">Chocolate</label>
        <label><input type="checkbox" name="flavorNotes[]" value="Citrus">Citrus</label>
        <label><input type="checkbox" name="flavorNotes[]" value="Fruity">Fruity</label>
        <label><input type="checkbox" name="flavorNotes[]" value="Roasted">Roasted</label>
      </div>
    </div>

    <button type="submit">Save</button>
  </form>
  <a href="/">Back to List</a>
</div>
</body>
</html>
