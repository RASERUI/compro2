<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    /* General Body Styles */
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(45deg, #FF9DFF, #9E4BFF, #5CC1FF, #4BFFFB);
      background-size: 400% 400%;
      animation: gradientAnimation 10s ease infinite;
      color: white;
      text-align: center;
      padding: 50px 0;
      margin: 0;
    }

    /* Animation for Background Gradient */
    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Form Container */
    .login-container {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 15px;
      padding: 30px;
      width: 300px;
      margin: 0 auto;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
    }

    /* Form Heading */
    h2 {
      font-size: 28px;
      color: #fff;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
    }

    /* Input Fields */
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 10px;
      border: 2px solid #fff;
      background-color: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
    }

    /* Focus Effect on Input Fields */
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #FF9DFF;
      background-color: rgba(255, 255, 255, 0.3);
    }

    /* Submit Button */
    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background-color: #FF9DFF;
      color: #fff;
      border: none;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    /* Hover Effect on Button */
    button:hover {
      background-color: #9E4BFF;
    }

    /* Error Message */
    .error-message {
      color: red;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div class="login-container">
  <h2>Login</h2>
  <form method="post" action="/login">
    <label for="username">Username:</label><br>
    <input type="text" name="username" required><br><br>
    <label for="password">Password:</label><br>
    <input type="password" name="password" required><br><br>
    <button type="submit">Login</button>
  </form>
  <!-- Error message example (add your server-side error message here) -->
  <p class="error-message" id="error-message" style="display: none;"></p>
</div>

<script>
  // Example error message handler
  // You can set this dynamically based on your server-side response.
  const errorMessage = ""; // Set your error message here if applicable
  if (errorMessage) {
    document.getElementById('error-message').innerText = errorMessage;
    document.getElementById('error-message').style.display = 'block';
  }
</script>
</body>
</html>
