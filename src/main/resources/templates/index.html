<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Coffee</title>

    <style>
        /* Importing Google Fonts (similar to Nightcord's style) */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap'); /* Bold modern font */

        /* General Body Styles */
        body {
            background: linear-gradient(45deg, #ff6ec7, #ff9a8b, #6a11cb, #2575fc); /* Gradient colors */
            background-size: 400% 400%; /* Ensures large gradient area */
            animation: gradientAnimation 15s ease infinite; /* Animation for the background change */
            color: black;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh; /* Ensure body covers full height of the viewport */
        }

        /* Target only the Coffee List Heading */
        h1 {
            color: white;
            text-align: center;
            font-size: 48px; /* Increase the font size for prominence */
            font-family: 'Montserrat', sans-serif; /* Custom font for a bolder, modern feel */
            font-weight: 600; /* Bold weight */
            letter-spacing: 2px; /* Add spacing between letters for a dynamic look */
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.2); /* Add subtle shadow to make the text pop */
            padding-top: 20px;
        }

        /* Links */
        a {
            text-decoration: none;
            margin-right: 10px;
            color: white;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Styled links with specific backgrounds */
        a[href^="/add"] {
            background-color: blue;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
        }

        a[href^="/edit"] {
            background-color: green;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
        }

        a[href^="/delete"] {
            background-color: red;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* Container for Add new coffee and Search form */
        .form-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }

        /* Add new coffee button aligned with Actions */
        .add-coffee {
            background: linear-gradient(45deg, #66ccff, #80b3ff); /* Lighter sky blue gradient */
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .add-coffee:hover {
            background: linear-gradient(45deg, #80b3ff, #66ccff); /* Reverse gradient on hover */
        }

        /* Search form layout aligned with ID column */
        .search-form {
            display: flex;
            justify-content: flex-start;
            gap: 10px;
        }

        form input[type="text"] {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 200px; /* Adjust width for the search input */
            background-color: white; /* White background for the input */
        }

        button {
            padding: 6px 12px;
            background: linear-gradient(45deg, #66ccff, #80b3ff); /* Lighter sky blue gradient */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(45deg, #80b3ff, #66ccff); /* Reverse gradient on hover */
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white; /* Ensure the table has a white background */
            border-radius: 8px; /* Rounded corners for the table */
            overflow: hidden;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            background-color: white; /* Ensure the cells have a white background */
        }

        th {
            background-color: #f4f4f4;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: white !important; /* Fix hover background color to remain white */
        }

        /* Gradient Animation */
        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>
<body>
<h1>Coffee List</h1>

<!-- Container for Add Coffee and Search form -->
<div class="form-container">
    <a href="/add" class="add-coffee">Add new coffee</a>

    <div class="search-form">
        <form>
            <input type="text" name="search" placeholder="Search...">
            <button>Search</button>
        </form>
    </div>
</div>

<!-- Coffee Table -->
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Size</th>
        <th>Price(PHP)</th>
        <th>Roast Level</th>
        <th>Origin</th>
        <th>Decaf</th>
        <th>Stock</th>
        <th>Flavor Notes</th>
        <th>Brew Method</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="coffee: ${coffee}">
        <td th:text = "${coffee.id}"></td>
        <td th:text = "${coffee.name}"></td>
        <td th:text = "${coffee.type}"></td>
        <td th:text = "${coffee.size}"></td>
        <td th:text = "${coffee.price}"></td>
        <td th:text = "${coffee.roastLevel}"></td>
        <td th:text = "${coffee.origin}"></td>
        <td th:text = "${coffee.decaf}"></td>
        <td th:text = "${coffee.stock}"></td>
        <td th:text = "${coffee.flavorNotes != null ? #strings.arrayJoin(coffee.flavorNotes, ', ') : 'No flavor notes'}"></td>
        <td th:text = "${coffee.brewMethod}"></td>
        <td>
            <a th:href = "@{/delete(id=${coffee.id})}">Delete </a>
            <a th:href="@{/edit(id=${coffee.id})}">Edit</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
