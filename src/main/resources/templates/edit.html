<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Coffee</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #dbffff;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      width: 100%;
    }
    h1 { text-align: center; margin-bottom: 20px; }
    form > div { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    input[type="checkbox"] { margin-right: 5px; }
    .checkbox-group label {
      display: inline-block;
      margin-right: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: black;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: white;
      color: black;
      border: 1px solid black;
    }
    a {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: black;
      text-decoration: none;
    }
    a:hover {
      color: white;
      background-color: black;
      padding: 8px;
      border-radius: 5px;
    }
  </style>

</head>
<body>
<div class="container">
  <h1>Edit Coffee</h1>
  <form th:action="@{/update}" method="post">
    <input type="hidden" name="id" th:value="${coffee.id}" />

    <div>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" th:value="${coffee.name}" required>
    </div>

    <div>
      <label>Type:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="type[]" value="Robusta" th:checked="${coffee.type != null and coffee.type.contains('Robusta')}">Robusta</label>
        <label><input type="checkbox" name="type[]" value="Arabica" th:checked="${coffee.type != null and coffee.type.contains('Arabica')}">Arabica</label>
      </div>
    </div>

    <div>
      <label>Size:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="size[]" value="Small" th:checked="${coffee.size != null and coffee.size.contains('Small')}">Small</label>
        <label><input type="checkbox" name="size[]" value="Medium" th:checked="${coffee.size != null and coffee.size.contains('Medium')}">Medium</label>
        <label><input type="checkbox" name="size[]" value="Large" th:checked="${coffee.size != null and coffee.size.contains('Large')}">Large</label>
      </div>
    </div>

    <div>
      <label for="price">Price:</label>
      <input type="number" step="0.1" id="price" name="price" th:value="${coffee.price}" required>
    </div>

    <div>
      <label>Roast Level:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="roastLevel[]" value="Light" th:checked="${coffee.roastLevel != null and coffee.roastLevel.contains('Light')}">Light</label>
        <label><input type="checkbox" name="roastLevel[]" value="Medium" th:checked="${coffee.roastLevel != null and coffee.roastLevel.contains('Medium')}">Medium</label>
        <label><input type="checkbox" name="roastLevel[]" value="Dark" th:checked="${coffee.roastLevel != null and coffee.roastLevel.contains('Dark')}">Dark</label>
      </div>
    </div>

    <div>
      <label for="origin">Origin:</label>
      <input type="text" id="origin" name="origin" th:value="${coffee.origin}" required>
    </div>

    <div>
      <label>Decaf:</label>
      <input type="hidden" name="isDecaf" value="false">
      <label><input type="checkbox" id="isDecaf" name="isDecaf" value="true" th:checked="${coffee.isDecaf}">Yes</label>
    </div>

    <div>
      <label>Brew method:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="brewMethod[]" value="Drip" th:checked="${coffee.brewMethod != null and coffee.brewMethod.contains('Drip')}">Drip</label>
        <label><input type="checkbox" name="brewMethod[]" value="French-Press" th:checked="${coffee.brewMethod != null and coffee.brewMethod.contains('French-Press')}">French Press</label>
        <label><input type="checkbox" name="brewMethod[]" value="Espresso" th:checked="${coffee.brewMethod != null and coffee.brewMethod.contains('Espresso')}">Espresso</label>
      </div>
    </div>

    <div>
      <label for="stock">Stock:</label>
      <input type="number" id="stock" name="stock" th:value="${coffee.stock}" required>
    </div>

    <div>
      <label>Flavor Notes:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="flavorNotes[]" value="Chocolate" th:checked="${coffee.flavorNotes != null and coffee.flavorNotes.contains('Chocolate')}">Chocolate</label>
        <label><input type="checkbox" name="flavorNotes[]" value="Citrus" th:checked="${coffee.flavorNotes != null and coffee.flavorNotes.contains('Citrus')}">Citrus</label>
        <label><input type="checkbox" name="flavorNotes[]" value="Fruity" th:checked="${coffee.flavorNotes != null and coffee.flavorNotes.contains('Fruity')}">Fruity</label>
        <label><input type="checkbox" name="flavorNotes[]" value="Roasted" th:checked="${coffee.flavorNotes != null and coffee.flavorNotes.contains('Roasted')}">Roasted</label>
      </div>
    </div>

    <button type="submit">Update Coffee</button>
  </form>
  <div>
    <a href="/">Back to List</a>
  </div>
</div>
</body>
</html>
