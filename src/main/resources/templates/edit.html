<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Coffee</title>

  <style>
    body {
      box-shadow: 0px 3px 5px rgba(0,0,0,0.1);
      background-color: #dbffff;
      display: flex;
      flex-wrap: wrap;
      flex-direction: column;
      place-content: center;
      height: 750px;
    }

    input {
      border-radius: 5px;
      height: 40px;
    }

    div {
      padding: 10px;
    }

    a {
      text-decoration: none;
      border-radius: 5px;
      box-shadow: 0px 3px 5px rgba(0,0,0,0.1);
      padding: 10px;
      color: black;
      width: 100px;
    }

    a:hover {
      background-color: black;
      color: white;
    }

    button {
      text-decoration: none;
      border-radius: 5px;
      box-shadow: 0px 3px 5px rgba(0,0,0,0.1);
      padding: 10px;
      color: white;
      background-color: black;
      border: none;
    }

    button:hover {
      background-color: white;
      color: black;
      cursor: pointer;
    }
  </style>

</head>
<body>
<h1>Edit Coffee</h1>
<form th:action="@{/update}" method="post">
  <input type="hidden" name="id" th:value="${coffee.id}" />
  <input type="text" name="name" th:value="${coffee.name}" placeholder="Name" required />
  <input type="text" name="type" th:value="${coffee.type}" placeholder="Type" required />
  <input type="text" name="size" th:value="${coffee.size}" placeholder="Size" required />
  <input type="number" step="0.01" name="price" th:value="${coffee.price}" placeholder="Price" required />
  <input type="text" name="roastLevel" th:value="${coffee.roastLevel}" placeholder="Roast Level" required />
  <input type="text" name="origin" th:value="${coffee.origin}" placeholder="Origin" required />
  <input type="number" name="stock" th:value="${coffee.stock}" placeholder="Stock" required />
  <input type="text" name="brewMethod" th:value="${coffee.brewMethod}" placeholder="Brew Method" required />

  <div>
    <label>Flavor Notes:</label><br>
    <input type="checkbox" id="chocolate" name="flavorNotes" value="Chocolate"
           th:checked="${#arrays.contains(coffee.flavorNotes, 'Chocolate')}">
    <label for="chocolate">Chocolate</label><br>

    <input type="checkbox" id="citrus" name="flavorNotes" value="Citrus"
           th:checked="${#arrays.contains(coffee.flavorNotes, 'Citrus')}">
    <label for="citrus">Citrus</label><br>

    <input type="checkbox" id="fruity" name="flavorNotes" value="Fruity"
           th:checked="${#arrays.contains(coffee.flavorNotes, 'Fruity')}">
    <label for="fruity">Fruity</label><br>

    <input type="checkbox" id="roasted" name="flavorNotes" value="Roasted"
           th:checked="${#arrays.contains(coffee.flavorNotes, 'Roasted')}">
    <label for="roasted">Roasted</label><br>
  </div>

  <div>
    <label for="isDecaf">Decaf</label>
    <input type="checkbox" id="isDecaf" name="isDecaf" th:checked="${coffee.isDecaf}" value="true" />
  </div>

  <div>
    <button type="submit">Update Coffee</button>
  </div>
</form>
<div>
  <a href="/">Back to List</a>
</div>
</body>
</html>
